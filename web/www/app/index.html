<title>Corvus Noctis</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #0c0a10; color: #e8e4f0; font: 16px/1.4 Menlo, ui-monospace, monospace; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 8px 0; box-sizing: border-box;
         padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  /* iOS 12: no aspect-ratio, dvh or clamp(). width + height:auto keeps the canvas 4:3. */
  canvas { display: block; width: 100%; max-width: 800px; height: auto; image-rendering: pixelated;
           touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  @media (min-aspect-ratio: 4/3) { canvas { width: auto; height: calc(100vh - 110px); max-width: none; } }
  form { display: flex; width: 100%; max-width: 800px; padding: 8px 10px 0; box-sizing: border-box; }
  input { -webkit-flex: 1; flex: 1; min-width: 0; font: inherit; font-size: 18px; padding: 10px 12px; border-radius: 6px;
          border: 2px solid #5b3f8c; background: #15111d; color: #ffd166; outline: none; -webkit-appearance: none; }
  input:focus { border-color: #ffd166; }
  button { font: inherit; font-size: 18px; padding: 10px 18px; margin-left: 8px; border-radius: 6px; border: 2px solid #ffd166;
           background: #5b3f8c; color: #ffd166; -webkit-appearance: none; }
  footer { color: #8a80a0; font-size: 13px; padding: 8px; text-align: center; }
  footer a { color: #8a80a0; }
  /* Boot splash: the crow lights the lantern while the wasm loads. */
  #splash { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 10; background: #0c0a10;
            display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column;
            -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center;
            -webkit-transition: opacity 0.45s; transition: opacity 0.45s; }
  #splash.gone { opacity: 0; pointer-events: none; }
  #splash img { width: 168px; height: 168px; -webkit-animation: bob 1.6s ease-in-out infinite; animation: bob 1.6s ease-in-out infinite; }
  #splash h1 { color: #ffd166; font-size: 34px; letter-spacing: 0.22em; margin: 18px 0 4px; }
  #splash p { color: #b9b2c8; margin: 0 0 18px; }
  #splash .bar { width: 220px; height: 10px; border: 2px solid #5b3f8c; }
  #splash .bar i { display: block; height: 100%; width: 0; background: #ffd166; -webkit-transition: width 0.3s; transition: width 0.3s; }
  #splash small { color: #5c5470; margin-top: 10px; }
  @-webkit-keyframes bob { 50% { -webkit-transform: translateY(-6px); } }
  @keyframes bob { 50% { transform: translateY(-6px); } }
</style>
</head>
<body>
<div id="splash" role="status" aria-label="Corvus is booting">
  <img src="../icons/icon-512.png" alt="">
  <h1>CORVUS</h1>
  <p>an operating system you can talk to</p>
  <div class="bar"><i id="splash-bar"></i></div>
  <small id="splash-line">lighting the lantern...</small>
</div>
<canvas id="screen" width="800" height="600" aria-label="Corvus OS console"></canvas>
<form id="line" autocomplete="off">
  <input id="input" placeholder="type a command, e.g. calc (2 + 3) * 4" autocapitalize="off" autocorrect="off"
         spellcheck="false" enterkeyhint="send" aria-label="Corvus shell input">
  <button type="submit">Enter</button>
</form>
<footer><span id="status">booting…</span> · Corvus OS web edition · <a href="../">get Corvus</a> · <a href="https://github.com/gabe-maxxing/corvus-noctis">source (MIT)</a></footer>
<script type="module" src="app.js"></script>
</body>
</html>
