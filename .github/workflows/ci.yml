name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none-softfloat
      - name: Install QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-arm
      - name: Build kernel (no warnings allowed)
        run: |
          cargo build --release 2>&1 | tee build.log
          if grep -q '^warning' build.log; then echo "::error::kernel build has warnings"; exit 1; fi
      - name: Pointer proof (HELP button == serial help)
        run: python3 tools/prove_pointer.py
      - name: Check web edition compiles (no warnings allowed)
        run: |
          rustup target add wasm32-unknown-unknown
          cd web && cargo build --release 2>&1 | tee ../web.log
          if grep -q '^warning' ../web.log; then echo "::error::web build has warnings"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: corvus-os-kernel
          path: target/aarch64-unknown-none-softfloat/release/corvus-os
      - name: Publish nightly kernel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/aarch64-unknown-none-softfloat/release/corvus-os corvus-os-aarch64.elf
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly corvus-os-aarch64.elf README.md LICENSE \
            --prerelease --target "$GITHUB_SHA" --title "Corvus OS nightly" \
            --notes "Kernel ELF from $GITHUB_SHA. Run: qemu-system-aarch64 -machine virt -cpu cortex-a57 -device ramfb -nographic -kernel corvus-os-aarch64.elf"
