name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none-softfloat
      - name: Install QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-arm
      - name: Build kernel (no warnings allowed)
        run: |
          cargo build --release 2>&1 | tee build.log
          if grep -q '^warning' build.log; then echo "::error::kernel build has warnings"; exit 1; fi
      - name: Pointer proof (HELP button == serial help)
        run: python3 tools/prove_pointer.py
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.130
      - name: Build web edition (no warnings, MVP wasm, ES2017 for iOS 12)
        run: |
          rustup target add wasm32-unknown-unknown
          command -v wasm-bindgen || cargo install wasm-bindgen-cli --version =0.2.130 --locked
          (cd web && cargo build --release 2>&1 | tee ../web.log)
          if grep -q '^warning' web.log; then echo "::error::web build has warnings"; exit 1; fi
          .github/scripts/build-web.sh ci
      - name: Check installers
        run: |
          sh -n dist/install.sh && sh -n mac/make-app.sh
          mac/make-app.sh target/aarch64-unknown-none-softfloat/release/corvus-os /tmp/dist
          unzip -l /tmp/dist/Corvus-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: corvus-os-kernel
          path: target/aarch64-unknown-none-softfloat/release/corvus-os
